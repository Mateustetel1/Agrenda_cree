<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3f007a">
    <title>Agenda de Estudos</title>
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Agenda de Estudos</h1>
            <button id="installBtn" class="btn install-btn" hidden>Instalar App</button>
        </header>

        <section class="section">
            <h2>Compromissos Agendados</h2>

            <div id="botaoNovoCompromissoSection" class="apenas-edicao" style="margin-bottom: 12px;">
                <button class="btn btn-success" onclick="toggleFormCompromisso()">
                    ➕ Novo Compromisso
                </button>
            </div>

            <div id="formCompromissoSection" class="form-section apenas-edicao">
                <form id="compromissoForm">
                    <!-- Campo oculto para controle de edição -->
                    <input type="hidden" id="compromissoId">

                    <div class="form-group">
                        <label for="titulo">Título</label>
                        <input type="text" id="titulo" placeholder="Ex: Prova de Matemática" required autocomplete="off">
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="categoria">Categoria</label>
                            <select id="categoria" required>
                                <option value="ESCOLA">Escola</option>
                                <option value="SENAI">SENAI</option>
                                <option value="PESSOAL">Pessoal</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="tipo">Tipo</label>
                            <select id="tipo" required>
                                <option value="PROVA">Prova</option>
                                <option value="TAREFA">Tarefa</option>
                                <option value="EVENTO">Evento</option>
                                <option value="LEMBRETE">Lembrete</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="materia">Matéria</label>
                            <input type="text" id="materia" placeholder="Ex: Geral, Química..." autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label for="data_evento">Data do Evento</label>
                            <input type="date" id="data_evento" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="descricao">Descrição</label>
                        <input type="text" id="descricao" placeholder="Detalhes do compromisso..." required autocomplete="off">
                    </div>

                    <div class="form-group checkbox-group">
                        <label>
                            <input type="checkbox" id="vale_nota"> Vale Nota / Avaliativo
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="btnSalvar">Salvar</button>
                        <button type="button" class="btn btn-secondary" onclick="limparEFecharFormulario()">Cancelar</button>
                    </div>
                </form>
            </div>

            <div id="compromissosList" class="ordem-servico-list">
                <p class="empty-message">Carregando compromissos...</p>
            </div>
        </section>
    </div>

    <footer class="footer">
        <p>Painel de Gestão - Integração Bot & Web @Bene</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
